<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>EGAT - ฝ่ายโรงงานและอะไหล่</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body { background-color: #f8f9fa; }
    .container { margin-top: 50px; }
    .logo { width: 80px; }
  </style>
</head>
<body>
  <div class="container text-center">
    <img src="{{ url_for('static', filename='egat_logo.png') }}" alt="EGAT Logo" class="logo mb-3">
    <h1>การไฟฟ้าฝ่ายผลิตแห่งประเทศไทย</h1>
    <h4>ฝ่ายโรงงานและอะไหล่</h4>
    <hr>

    <form method="post" enctype="multipart/form-data" class="mt-4">
      <div class="mb-3">
        <input type="file" name="image" accept="image/*" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary">Predict</button>
    </form>

    {% if image_path %}
      <div class="mt-4">
        <h5>ผลลัพธ์:</h5>
        <img src="{{ image_path }}" class="img-fluid rounded shadow">
        <ul class="list-group mt-3">
          {% for item in prediction %}
            <li class="list-group-item">{{ item }}</li>
          {% endfor %}
        </ul>
      </div>
    {% endif %}
  </div>
</body>
</html>
